<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE+ Events — Render to Reality. No Compromise.</title>
<link rel="stylesheet" href="./colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ============================================================
   ONE+ Marketing Site — page-specific styles
   ============================================================ */
html, body { background: var(--bg-1); min-height: 100vh; }
body { font-family: var(--font-body-en); color: var(--fg-1); }
a { color: inherit; }

/* ===== LOGO LOCKUP (used by Nav + Footer) ===== */
.op-logo {
  display: inline-flex; align-items: baseline; gap: 4px;
  font-family: var(--font-display-en);
  font-weight: 800; font-size: 22px;
  font-style: italic; letter-spacing: -0.03em;
  color: var(--op-white-pure);
  text-decoration: none;
}
.op-logo .plus { color: var(--op-red); font-size: 26px; line-height: 1; transform: translateY(2px); }
.op-logo .logo-tag {
  font-family: var(--font-mono); font-size: 9px; font-style: normal;
  font-weight: 600; letter-spacing: 0.28em;
  color: var(--op-cyan); margin-left: 8px; padding-left: 8px;
  border-left: 1px solid rgba(255,255,255,0.18); align-self: stretch;
  display: flex; align-items: center;
}

/* ===== NAV ===== */
.op-nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 32px;
  padding: 16px 48px;
  background: rgba(15, 23, 42, 0.72);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(40, 50, 74, 0.6);
}
.op-nav-links { display: flex; gap: 28px; margin-left: 16px; }
.op-nav-links a {
  font-family: var(--font-display-en); font-size: 14px; font-weight: 500;
  color: rgba(241, 245, 251, 0.75); text-decoration: none;
  position: relative; padding: 18px 0;
  transition: color var(--dur-base) var(--ease-out);
}
.op-nav-links a:hover { color: var(--op-cyan-bright); }
.op-nav-links a.active { color: var(--op-cyan); }
.op-nav-links a.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--op-cyan);
}
.op-nav-right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.op-lang-toggle {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em;
  background: transparent; border: 1px solid rgba(40, 50, 74, 0.8);
  color: rgba(241, 245, 251, 0.6); padding: 8px 12px;
  border-radius: var(--r-2); cursor: pointer;
  display: flex; gap: 6px;
}
.op-lang-toggle .active { color: var(--op-cyan); }
.op-lang-toggle .sep { color: var(--op-steel-muted); }
.op-lang-toggle:hover { border-color: var(--op-cyan); }

/* ===== CTAs ===== */
.op-cta-primary {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-display-en); font-weight: 600; font-size: 14px;
  background: var(--op-red); color: white;
  padding: 10px 18px; border-radius: var(--r-2); border: none;
  cursor: pointer; text-decoration: none;
  box-shadow: var(--shadow-2);
  transition: all var(--dur-base) var(--ease-out);
}
.op-cta-primary:hover { background: var(--op-red-bright); box-shadow: var(--shadow-red); transform: translateY(-1px); }
.op-cta-primary:active { background: var(--op-red-dim); transform: translateY(0); }
.op-cta-primary.lg { padding: 14px 24px; font-size: 15px; }
.op-cta-primary.full { width: 100%; justify-content: center; }
.op-cta-primary .arr { font-family: var(--font-mono); font-weight: 500; font-size: 16px; }

.op-cta-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-display-en); font-weight: 600; font-size: 15px;
  background: transparent; color: var(--op-white-pure);
  padding: 14px 24px; border-radius: var(--r-2);
  border: 1px solid rgba(241, 245, 251, 0.18);
  cursor: pointer; text-decoration: none;
  transition: all var(--dur-base) var(--ease-out);
}
.op-cta-ghost:hover { border-color: var(--op-cyan); color: var(--op-cyan); }

/* ===== HERO ===== */
.op-hero {
  position: relative; background: var(--op-slate); overflow: hidden;
  min-height: 760px;
  border-bottom: 1px solid #28324A;
}
.op-hero-spotlight { position: absolute; inset: 0; background: var(--grad-spotlight); pointer-events: none; }
.op-hero-grid {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.18;
  background-image:
    linear-gradient(to right, rgba(45,156,219,0.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(45,156,219,0.08) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 80%);
}
.op-hero-inner { position: relative; max-width: 1400px; margin: 0 auto; padding: 80px 48px 56px; }

.op-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--op-cyan);
}
.op-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--op-red); box-shadow: 0 0 0 4px rgba(209,26,42,0.18); }

.op-hero-eyebrow { margin-bottom: 28px; }

.op-hero-claim {
  font-family: var(--font-display-en);
  font-size: clamp(56px, 7vw, 96px);
  line-height: 0.96; font-weight: 800;
  letter-spacing: -0.035em; color: var(--op-white-pure);
  margin: 0 0 28px; max-width: 14ch;
  position: relative;
}
.op-hero-claim .plus-accent {
  color: var(--op-red); font-style: normal;
  text-shadow: 0 0 32px rgba(209, 26, 42, 0.4);
}

.op-hero-sub {
  font-family: var(--font-body-en); font-size: 20px; line-height: 1.5;
  font-weight: 400; color: rgba(241, 245, 251, 0.78);
  max-width: 56ch; margin: 0 0 36px;
}

.op-hero-actions { display: flex; gap: 14px; margin-bottom: 72px; }

.op-hero-metrics {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border-top: 1px solid #28324A; padding-top: 28px;
}
.m-stat { padding-right: 24px; border-right: 1px solid #28324A; }
.m-stat:last-child { border-right: none; }
.m-num {
  font-family: var(--font-display-en); font-size: 56px; line-height: 1;
  font-weight: 800; letter-spacing: -0.03em; color: var(--op-white-pure);
}
.m-num .grad { background: var(--grad-cyan-bright); -webkit-background-clip: text; background-clip: text; color: transparent; }
.m-num .red { color: var(--op-red); }
.m-num .m-unit { font-size: 28px; font-weight: 600; color: rgba(241,245,251,0.5); margin-left: 2px; }
.m-label {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(183, 194, 210, 0.7);
  margin-top: 10px; line-height: 1.4;
}

.op-hero-blueprint {
  position: absolute; bottom: 18px; left: 48px; right: 48px;
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(107, 122, 141, 0.7);
}
.op-hero-blueprint .line { flex: 1; height: 1px; background: rgba(40, 50, 74, 0.8); }

/* ===== SECTION HEAD (shared) ===== */
.op-section-head { max-width: 800px; margin: 0 0 56px; }
.op-section-title {
  font-family: var(--font-display-en);
  font-size: clamp(40px, 5vw, 64px); line-height: 1.02;
  font-weight: 800; letter-spacing: -0.025em;
  margin: 16px 0 20px; color: var(--op-ink);
}
.op-section-sub { font-size: 19px; line-height: 1.5; color: var(--op-ink-soft); max-width: 60ch; }

/* ===== CAPABILITIES ===== */
.op-capabilities { padding: 120px 48px; max-width: 1400px; margin: 0 auto; }
.op-cap-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.op-cap {
  background: var(--op-white-pure);
  border: 1px solid var(--op-steel-border);
  border-radius: var(--r-4); padding: 28px 24px;
  transition: all var(--dur-base) var(--ease-out);
  position: relative; overflow: hidden;
}
.op-cap:hover { box-shadow: var(--shadow-3); transform: translateY(-2px); border-color: var(--border-2); }
.op-cap:hover::before { transform: scaleX(1); }
.op-cap::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad-cyan-to-navy); transform: scaleX(0); transform-origin: left;
  transition: transform var(--dur-slow) var(--ease-out);
}
.op-cap-icon {
  width: 48px; height: 48px; border-radius: var(--r-2);
  background: linear-gradient(135deg, rgba(45,156,219,0.08), rgba(31,64,104,0.08));
  border: 1px solid rgba(45,156,219,0.18);
  display: flex; align-items: center; justify-content: center;
  color: var(--op-cyan); margin-bottom: 20px;
}
.op-cap-icon svg { width: 22px; height: 22px; stroke-width: 1.5; }
.op-cap-tag {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--op-red); margin-bottom: 6px;
}
.op-cap-title {
  font-family: var(--font-display-en); font-size: 22px; font-weight: 700;
  letter-spacing: -0.01em; color: var(--op-ink); margin: 0 0 10px;
}
.op-cap-body { font-size: 14px; line-height: 1.55; color: var(--op-ink-soft); margin: 0 0 20px; }
.op-cap-meta {
  font-family: var(--font-mono); font-size: 11px; color: var(--op-steel-muted);
  padding-top: 14px; border-top: 1px dashed var(--op-steel-border);
}

/* ===== PORTFOLIO ===== */
.op-portfolio {
  background: var(--bg-3); padding: 120px 48px;
  border-top: 1px solid var(--border-1); border-bottom: 1px solid var(--border-1);
}
.op-portfolio .op-section-head { max-width: 1400px; margin: 0 auto 48px; }
.op-filter-row { display: flex; align-items: center; gap: 8px; margin-top: 32px; flex-wrap: wrap; }
.op-chip-btn {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--op-white-pure); border: 1px solid var(--op-steel-border);
  color: var(--op-ink-soft); padding: 8px 14px;
  border-radius: var(--r-2); cursor: pointer;
  transition: all var(--dur-base) var(--ease-out);
}
.op-chip-btn:hover { border-color: var(--op-cyan); color: var(--op-cyan); }
.op-chip-btn.active { background: var(--op-ink); color: var(--op-white-pure); border-color: var(--op-ink); }
.op-filter-count {
  font-family: var(--font-mono); font-size: 11px; color: var(--op-steel-muted);
  letter-spacing: 0.08em; margin-left: auto;
}

.op-portfolio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto; }
.op-case {
  background: var(--op-white-pure); border: 1px solid var(--op-steel-border);
  border-radius: var(--r-4); overflow: hidden;
  transition: all var(--dur-base) var(--ease-out); cursor: pointer;
  box-shadow: var(--shadow-1);
}
.op-case:hover { box-shadow: var(--shadow-3); transform: translateY(-2px); }
.op-case-image {
  aspect-ratio: 16/10; position: relative; overflow: hidden;
}
.op-case-grid-overlay {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.4;
  background-image: linear-gradient(to right, rgba(45,156,219,0.12) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(45,156,219,0.08) 1px, transparent 1px);
  background-size: 40px 40px;
}
.op-case-corner {
  position: absolute; top: 12px; left: 14px;
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.75);
}
.op-case-featured {
  position: absolute; top: 12px; right: 12px;
  background: var(--op-red); color: white;
  font: 700 9px/1 var(--font-mono); letter-spacing: 0.14em;
  padding: 5px 8px; text-transform: uppercase;
}
.op-case-triangle {
  position: absolute; bottom: 18px; left: 18px;
  width: 0; height: 0;
  border-left: 9px solid transparent; border-right: 9px solid transparent;
  border-bottom: 16px solid var(--op-red);
  filter: drop-shadow(0 4px 8px rgba(209,26,42,0.4));
}
.op-case-body { padding: 16px 18px 0; }
.op-case-sector {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.18em; color: var(--op-cyan);
}
.op-case-title {
  font-family: var(--font-display-en); font-size: 18px; font-weight: 700;
  letter-spacing: -0.01em; color: var(--op-ink); margin: 4px 0 0;
  line-height: 1.25;
}
.op-case-specs {
  display: flex; margin: 16px -18px 0;
  border-top: 1px solid var(--op-steel-border);
  padding: 12px 18px;
}
.op-case-specs .spec { flex: 1; }
.op-case-specs .lbl {
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--op-steel-muted);
}
.op-case-specs .val {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--op-ink); margin-top: 2px;
}

/* ===== PROCESS TIMELINE ===== */
.op-process { padding: 120px 48px; max-width: 1200px; margin: 0 auto; }
.op-timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0; }
.op-tl-step { display: grid; grid-template-columns: 120px 1fr; gap: 32px; padding: 28px 0; border-bottom: 1px dashed var(--op-steel-border); }
.op-tl-step:last-child { border-bottom: none; }
.op-tl-rail { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.op-tl-num {
  font-family: var(--font-mono); font-size: 28px; font-weight: 700;
  color: var(--op-steel-muted); letter-spacing: -0.02em;
}
.op-tl-code {
  width: 44px; height: 44px; border-radius: var(--r-2);
  background: var(--grad-cyan-to-navy); color: white;
  font-family: var(--font-display-en); font-size: 22px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-cyan);
}
.op-tl-line {
  position: absolute; left: 22px; top: 88px; bottom: -28px;
  width: 1px; background: var(--op-steel-border);
}
.op-tl-content h3 {
  font-family: var(--font-display-en); font-size: 32px; font-weight: 700;
  letter-spacing: -0.02em; color: var(--op-ink); margin: 0 0 10px;
}
.op-tl-content p { font-size: 17px; line-height: 1.55; color: var(--op-ink-soft); margin: 0 0 14px; max-width: 60ch; }
.op-tl-meta { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--op-red); }

/* ===== CONTACT ===== */
.op-contact { padding: 120px 48px; max-width: 1400px; margin: 0 auto; }
.op-contact-card {
  background: var(--op-slate); border-radius: var(--r-4);
  display: grid; grid-template-columns: 1fr 1.1fr;
  overflow: hidden; position: relative;
  box-shadow: var(--shadow-4);
}
.op-contact-card::before {
  content: ""; position: absolute; inset: 0; background: var(--grad-spotlight); pointer-events: none;
}
.op-contact-left { padding: 56px 48px; color: var(--op-white-pure); position: relative; }
.op-contact-left .op-eyebrow { color: var(--op-cyan); margin-bottom: 16px; }
.op-contact-title {
  font-family: var(--font-display-en); font-size: 52px; font-weight: 800;
  letter-spacing: -0.025em; line-height: 1; margin: 0 0 18px;
}
.op-contact-sub { font-size: 17px; line-height: 1.55; color: rgba(241,245,251,0.75); margin: 0 0 40px; max-width: 40ch; }
.op-contact-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px; }
.fact .lbl { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: var(--op-cyan); }
.fact .val { font-family: var(--font-display-en); font-size: 15px; font-weight: 600; color: var(--op-white-pure); margin-top: 4px; }
.fact .val.highlight { color: var(--op-red-bright); }

.op-contact-form { background: var(--op-white-pure); padding: 56px 48px; display: flex; flex-direction: column; gap: 18px; position: relative; }
.op-contact-form .field { display: flex; flex-direction: column; gap: 6px; }
.op-contact-form label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--op-steel-muted);
}
.op-contact-form input, .op-contact-form textarea, .op-contact-form select {
  background: var(--op-white-pure); border: 1px solid var(--op-steel-border);
  border-radius: var(--r-2); padding: 12px 14px;
  font: 400 15px/22px var(--font-body-en); color: var(--op-ink);
  outline: none; transition: all var(--dur-base) var(--ease-out);
  appearance: none; -webkit-appearance: none;
}
.op-contact-form input:focus, .op-contact-form textarea:focus, .op-contact-form select:focus {
  border-color: var(--op-cyan); box-shadow: 0 0 0 3px rgba(45,156,219,0.18);
}
.op-contact-form textarea { resize: vertical; font-family: var(--font-body-en); }
.op-select { position: relative; }
.op-select select { width: 100%; padding-right: 32px; cursor: pointer; }
.op-select .chev { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--op-steel-muted); font-family: var(--font-mono); pointer-events: none; }
.op-form-foot { font-size: 11px; color: var(--op-steel-muted); margin-top: 4px; }

/* ===== FOOTER ===== */
.op-footer { background: var(--op-slate); color: rgba(241,245,251,0.75); padding: 80px 48px 32px; }
.op-footer-top { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 2fr; gap: 80px; padding-bottom: 56px; border-bottom: 1px solid #28324A; }
.op-footer-mission { font-size: 15px; line-height: 1.55; max-width: 36ch; color: rgba(183,194,210,0.85); margin: 20px 0 28px; }
.op-cert-row { display: flex; gap: 8px; flex-wrap: wrap; }
.cert {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  border: 1px solid #28324A; padding: 5px 10px; border-radius: var(--r-1);
  color: var(--op-cyan);
}
.op-footer-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.op-footer-cols .col h4 {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--op-steel-muted); margin: 0 0 16px;
}
.op-footer-cols .col a {
  display: block; padding: 6px 0; text-decoration: none;
  font-size: 14px; color: rgba(241,245,251,0.7);
  transition: color var(--dur-base) var(--ease-out);
}
.op-footer-cols .col a:hover { color: var(--op-cyan); }
.op-footer-bot {
  max-width: 1400px; margin: 32px auto 0; display: flex; justify-content: space-between; align-items: center;
}
.op-footer-bot .op-meta { color: rgba(107,122,141,0.6); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; }

/* responsive */
@media (max-width: 980px) {
  .op-nav-links { display: none; }
  .op-cap-grid, .op-portfolio-grid { grid-template-columns: 1fr 1fr; }
  .op-hero-metrics { grid-template-columns: 1fr 1fr; gap: 24px 0; }
  .m-stat { border-right: none; }
  .op-contact-card, .op-footer-top { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-screen-label="ONE+ Events Marketing Site">
  <div id="root"></div>

  <script type="text/babel" src="./Nav.jsx"></script>
  <script type="text/babel" src="./Hero.jsx"></script>
  <script type="text/babel" src="./Capabilities.jsx"></script>
  <script type="text/babel" src="./PortfolioGrid.jsx"></script>
  <script type="text/babel" src="./ProcessTimeline.jsx"></script>
  <script type="text/babel" src="./ContactPanel.jsx"></script>
  <script type="text/babel" src="./Footer.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [lang, setLang] = useState('EN');

      useEffect(() => {
        // Lucide icons render once components mount
        const t = setTimeout(() => window.lucide && window.lucide.createIcons(), 50);
        return () => clearTimeout(t);
      });

      return (
        <>
          <Nav lang={lang} setLang={setLang} />
          <Hero lang={lang} />
          <Capabilities />
          <PortfolioGrid />
          <ProcessTimeline />
          <ContactPanel />
          <Footer />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
